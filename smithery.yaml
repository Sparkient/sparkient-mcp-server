name: sparkient
displayName: Sparkient
description: >-
  Decision intelligence infrastructure for developers. Define a repeated
  decision, generate or add labelled examples, and train a task-specific model
  that returns a structured answer with confidence and reason codes. The
  compiled path targets under 100ms and must be validated on each workload;
  configured low-confidence cloud decisions can optionally escalate to an LLM.
version: 1.0.3
author: Sparkient
repository: https://github.com/sparkient/sparkient-mcp-server
homepage: https://sparkient.ai
icon: https://sparkient.ai/icon.png
tags:
  - decision-intelligence
  - machine-learning
  - content-moderation
  - classification
  - ai-agents
  - compiled-decisions
  - compiled-inference
  - edge-inference

startCommand:
  type: http
  url: https://mcp.sparkient.ai/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: Sparkient API Key
        minLength: 64
        maxLength: 64
        pattern: "^[0-9a-fA-F]{64}$"
        description: >-
          Your 64-character hexadecimal Sparkient API key. Create one at
          https://app.sparkient.ai/settings?tab=connect. Required for making API calls.
    required:
      - apiKey
  headers:
    Authorization: "Bearer {{apiKey}}"
