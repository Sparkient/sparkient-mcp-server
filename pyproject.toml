[project]
name = "sparkient-mcp-server"
version = "1.0.4"
description = "MCP server for Sparkient Decision Intelligence API"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
