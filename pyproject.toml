[project]
name = "sparkient-mcp-server"
version = "1.0.1"
description = "MCP server for Sparkient Decision Intelligence API"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "Peter Dobson" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "decision-intelligence", "ai-agents"]
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://sparkient.ai"
Repository = "https://github.com/Sparkient/sparkient-mcp-server"
Documentation = "https://docs.sparkient.ai"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
